<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#1a3a6b"/>
<title>NHIA M&amp;E Tools</title>
<link rel="manifest" href="manifest.json"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy:   #1a3a6b;
    --navy2:  #0a1628;
    --gold:   #f0c040;
    --green:  #27ae60;
    --red:    #c0392b;
    --amber:  #e67e22;
    --bg:     #f4f6fb;
    --card:   #ffffff;
    --text:   #1a2340;
    --muted:  #6b7a99;
    --border: #d0d8ee;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(26,58,107,.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── TOP BAR ── */
  #topbar {
    background: var(--navy); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; height: 56px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  #topbar .brand { font-size: 1rem; font-weight: 700; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
  #topbar .brand span { color: var(--gold); }
  #sync-badge {
    font-size: .72rem; padding: 2px 8px; border-radius: 20px;
    background: var(--amber); color: #fff; display: none;
  }
  #sync-badge.visible { display: inline-block; }
  #user-info { font-size: .78rem; color: #ccd6f0; text-align: right; }
  #user-info strong { color: var(--gold); }

  /* ── SCREENS ── */
  .screen { display: none; padding: 16px; max-width: 640px; margin: 0 auto; }
  .screen.active { display: block; }

  /* ── CARDS ── */
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 1rem; color: var(--navy); margin-bottom: 14px; border-bottom: 2px solid var(--gold); padding-bottom: 6px; }
  .card h3 { font-size: .9rem; color: var(--navy); margin-bottom: 10px; }

  /* ── FORMS ── */
  label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 4px; margin-top: 12px; font-weight: 600; }
  input, select, textarea {
    width: 100%; padding: 9px 12px; border: 1.5px solid var(--border);
    border-radius: 6px; font-size: .9rem; color: var(--text);
    background: #fafbff; transition: border-color .2s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--navy); }
  textarea { resize: vertical; min-height: 70px; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 18px; border-radius: 6px; border: none;
    font-size: .88rem; font-weight: 600; cursor: pointer; transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-gold    { background: var(--gold); color: var(--navy2); }
  .btn-green   { background: var(--green); color: #fff; }
  .btn-red     { background: var(--red); color: #fff; }
  .btn-ghost   { background: transparent; color: var(--navy); border: 1.5px solid var(--border); }
  .btn-sm      { padding: 6px 12px; font-size: .8rem; }
  .btn-block   { width: 100%; justify-content: center; margin-top: 10px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ── LOGIN ── */
  #login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; background: var(--navy2); padding: 24px;
  }
  #login-screen.active { display: flex; }
  .login-box { background: var(--card); border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
  .login-logo { text-align: center; margin-bottom: 24px; }
  .login-logo .emblem { font-size: 3rem; }
  .login-logo h1 { font-size: 1.3rem; color: var(--navy); margin-top: 8px; }
  .login-logo p  { font-size: .8rem; color: var(--muted); margin-top: 4px; }
  #login-error { color: var(--red); font-size: .82rem; margin-top: 10px; display: none; }

  /* ── BOTTOM NAV ── */
  #bottom-nav {
    display: none; position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1.5px solid var(--border);
    z-index: 100; padding-bottom: env(safe-area-inset-bottom);
  }
  #bottom-nav.visible { display: flex; }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 8px 4px 6px; cursor: pointer; border: none; background: none;
    font-size: .68rem; color: var(--muted); font-weight: 600; gap: 2px; transition: color .15s;
  }
  .nav-item .icon { font-size: 1.4rem; }
  .nav-item.active { color: var(--navy); }
  .nav-item.active .icon { filter: drop-shadow(0 0 4px rgba(26,58,107,.3)); }

  /* ── ASSIGNMENT CARDS ── */
  .assignment-card {
    border: 1.5px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px; cursor: pointer; transition: border-color .2s, box-shadow .2s;
  }
  .assignment-card:hover { border-color: var(--navy); box-shadow: var(--shadow); }
  .assignment-card .ac-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .assignment-card .ac-title { font-weight: 700; font-size: .95rem; color: var(--navy); }
  .assignment-card .ac-period { font-size: .78rem; color: var(--muted); margin-top: 3px; }
  .status-pill {
    font-size: .7rem; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  }
  .status-open     { background: #e8f5e9; color: var(--green); }
  .status-active   { background: #fff8e1; color: var(--amber); }
  .status-closed   { background: #fce4ec; color: var(--red); }
  .status-reported { background: #e8eaf6; color: #3949ab; }

  /* ── VISIT LIST ── */
  .visit-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border); gap: 8px;
  }
  .visit-row:last-child { border-bottom: none; }
  .visit-name { font-size: .88rem; font-weight: 600; }
  .visit-type { font-size: .75rem; color: var(--muted); }
  .visit-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* ── MODULE GRID ── */
  .module-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .module-tile {
    border: 1.5px solid var(--border); border-radius: var(--radius);
    padding: 14px 12px; cursor: pointer; text-align: center;
    transition: border-color .2s, box-shadow .2s; background: var(--card);
  }
  .module-tile:hover { border-color: var(--navy); box-shadow: var(--shadow); }
  .module-tile .m-icon { font-size: 1.8rem; }
  .module-tile .m-name { font-size: .8rem; font-weight: 700; color: var(--navy); margin-top: 6px; }
  .module-tile .m-prog { font-size: .72rem; color: var(--muted); margin-top: 4px; }
  .progress-ring { display: block; margin: 6px auto 0; }

  /* ── INDICATOR ROWS ── */
  .indicator-row {
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .indicator-row:last-child { border-bottom: none; }
  .ind-label { font-size: .84rem; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
  .ind-code  { font-size: .72rem; color: var(--gold); font-weight: 700; margin-bottom: 4px; }

  /* ── SCORE SUMMARY ── */
  .score-bar-wrap { background: var(--border); border-radius: 4px; height: 8px; margin-top: 6px; }
  .score-bar { height: 8px; border-radius: 4px; transition: width .4s; }
  .score-high   { background: var(--green); }
  .score-medium { background: var(--amber); }
  .score-low    { background: var(--red); }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--navy2); color: #fff; padding: 10px 20px; border-radius: 24px;
    font-size: .85rem; opacity: 0; transition: opacity .3s, transform .3s; z-index: 999; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── MODAL ── */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(10,22,40,.6);
    z-index: 200; align-items: flex-end; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 16px 16px 0 0;
    padding: 24px 20px 32px; width: 100%; max-width: 640px;
    max-height: 85vh; overflow-y: auto;
  }
  .modal h3 { font-size: 1rem; color: var(--navy); margin-bottom: 16px; }
  .modal-close { float: right; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--muted); }

  /* ── REPORT ── */
  .report-section { margin-bottom: 18px; }
  .report-section h4 { font-size: .85rem; color: var(--navy); font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
  .report-row { display: flex; justify-content: space-between; font-size: .83rem; padding: 4px 0; border-bottom: 1px dashed var(--border); }

  /* ── OFFLINE BANNER ── */
  #offline-banner {
    display: none; background: var(--amber); color: #fff;
    text-align: center; font-size: .8rem; font-weight: 600; padding: 6px;
  }
  #offline-banner.visible { display: block; }

  /* ── SPACER for bottom nav ── */
  .nav-spacer { height: 72px; }

  /* ── UTILITIES ── */
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .text-muted    { color: var(--muted); font-size: .82rem; }
  .text-gold     { color: #b8860b; font-weight: 700; }
  .mt-8  { margin-top: 8px; }
  .mt-12 { margin-top: 12px; }
  .mt-16 { margin-top: 16px; }
  .gap-8 { gap: 8px; }
  .hidden { display: none !important; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-state .big { font-size: 2.5rem; }
</style>
</head>
<body>

<!-- OFFLINE BANNER -->
<div id="offline-banner">⚠ You are offline — data will sync when connection is restored</div>

<!-- LOGIN -->
<div id="login-screen" class="screen active">
  <div class="login-box">
    <div class="login-logo">
      <div class="emblem">⚕</div>
      <h1>NHIA M&amp;E Tools</h1>
      <p>Provider Monitoring &amp; Evaluation System</p>
    </div>
    <label>Email Address</label>
    <input type="email" id="login-email" placeholder="you@nhia.gov.gh" autocomplete="username"/>
    <label>Password</label>
    <input type="password" id="login-password" autocomplete="current-password"/>
    <div id="login-error"></div>
    <button class="btn btn-primary btn-block mt-12" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- TOP BAR -->
<div id="topbar" style="display:none">
  <div class="brand">⚕ <span>NHIA</span> M&amp;E Tools</div>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="sync-badge" class="sync-badge">⏳ Pending</span>
    <div id="user-info"></div>
  </div>
</div>

<!-- HOME -->
<div id="home-screen" class="screen">
  <div class="card">
    <div class="flex-between">
      <h2 style="margin:0;border:none;padding:0">Monitoring Assignments</h2>
      <button class="btn btn-gold btn-sm" id="btn-new-assignment" onclick="openNewAssignment()" style="display:none">+ New</button>
    </div>
  </div>
  <div id="assignments-list"></div>
  <div class="nav-spacer"></div>
</div>

<!-- ASSIGNMENT DETAIL -->
<div id="assignment-screen" class="screen">
  <div class="card" id="assignment-header"></div>
  <div class="card">
    <div class="flex-between">
      <h2 style="margin:0;border:none;padding:0">Facility Visits</h2>
      <button class="btn btn-gold btn-sm" onclick="openAddVisit()" id="btn-add-visit">+ Add Visit</button>
    </div>
    <div id="visits-list" style="margin-top:12px"></div>
  </div>
  <div id="assignment-actions" style="margin-bottom:16px"></div>
  <div class="nav-spacer"></div>
</div>

<!-- MODULE SELECTOR -->
<div id="modules-screen" class="screen">
  <div class="card" id="visit-context-card"></div>
  <div class="module-grid" id="module-grid"></div>
  <div class="nav-spacer"></div>
</div>

<!-- MODULE FORM -->
<div id="module-form-screen" class="screen">
  <div class="card" id="module-form-header"></div>
  <div id="module-indicators"></div>
  <button class="btn btn-green btn-block" onclick="saveModule()">Save Module</button>
  <div class="nav-spacer"></div>
</div>

<!-- REPORT -->
<div id="report-screen" class="screen">
  <div class="card">
    <h2>Consolidated Team Report</h2>
    <div id="report-body"></div>
    <button class="btn btn-primary btn-block mt-12" onclick="downloadReport()">⬇ Download Report</button>
  </div>
  <div class="nav-spacer"></div>
</div>

<!-- SETTINGS -->
<div id="settings-screen" class="screen">
  <div class="card">
    <h2>Account</h2>
    <div id="settings-user-info" class="text-muted mt-8"></div>
    <button class="btn btn-ghost btn-block mt-12" onclick="doLogout()">Sign Out</button>
  </div>
  <div class="card">
    <h2>Offline Queue</h2>
    <div id="queue-info" class="text-muted mt-8">Checking…</div>
    <button class="btn btn-primary btn-block mt-12" onclick="flushQueue()">Sync Now</button>
  </div>
  <div class="nav-spacer"></div>
</div>

<!-- BOTTOM NAV -->
<div id="bottom-nav">
  <button class="nav-item active" onclick="navigate('home')"><span class="icon">🏠</span>Home</button>
  <button class="nav-item" onclick="navigate('report')" id="nav-report" style="display:none"><span class="icon">📄</span>Report</button>
  <button class="nav-item" onclick="navigate('settings')"><span class="icon">⚙️</span>Settings</button>
</div>

<!-- MODALS -->
<div class="modal-backdrop" id="modal-assignment">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-assignment')">✕</button>
    <h3>New Monitoring Assignment</h3>
    <label>Monitoring Period</label>
    <input type="text" id="f-period" placeholder="e.g. Q2 2026 – June"/>
    <label>District / Region</label>
    <input type="text" id="f-district" placeholder="e.g. Accra Metro"/>
    <label>Team Members (names, comma-separated)</label>
    <textarea id="f-members" placeholder="Ama Owusu, Kofi Mensah, …"></textarea>
    <button class="btn btn-primary btn-block mt-12" onclick="createAssignment()">Create Assignment</button>
  </div>
</div>

<div class="modal-backdrop" id="modal-visit">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-visit')">✕</button>
    <h3>Add Facility Visit</h3>
    <label>Facility Name</label>
    <input type="text" id="f-facility" placeholder="e.g. Tema General Hospital"/>
    <label>Visit Type</label>
    <select id="f-visit-type">
      <option value="facility">Health Facility</option>
      <option value="district">District Office</option>
    </select>
    <label>Visit Date</label>
    <input type="date" id="f-visit-date"/>
    <label>Notes (optional)</label>
    <textarea id="f-visit-notes" placeholder="Any pre-visit notes…"></textarea>
    <button class="btn btn-primary btn-block mt-12" onclick="addVisit()">Add Visit</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ────────────────────────────────────────────────────────────────
// CONFIGURATION — replace with your Supabase project credentials
// ────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://ukgowgggsitzqfwcjtlk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrZ293Z2dnc2l0enFmd2NqdGxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODE4MTAsImV4cCI6MjEwMjA1NzgxMH0.auzD0JYQm0iFGC_enj6HSPaYaAegvnG-dzDS-GAeNP0';

// ────────────────────────────────────────────────────────────────
// MODULE DEFINITIONS
// M1 Administrative | M2 Folder Verification | M3 Claims
// M4 Clinical       | M5 Facility Resources  | M6 Financial / FPHC
// ────────────────────────────────────────────────────────────────
const MODULES = [
  {
    id: 'M1', name: 'Administrative', icon: '🏛️',
    indicators: [
      { code: 'M1.1', label: 'Valid NHIA accreditation certificate displayed', type: 'select', options: ['Yes','No','N/A'] },
      { code: 'M1.2', label: 'Provider operating within accredited scope of practice', type: 'select', options: ['Yes','No','Partial'] },
      { code: 'M1.3', label: 'Staff list available and up to date', type: 'select', options: ['Yes','No','Partial'] },
      { code: 'M1.4', label: 'NHIS claims register maintained and accessible', type: 'select', options: ['Yes','No'] },
      { code: 'M1.5', label: 'Complaints mechanism in place and visible to patients', type: 'select', options: ['Yes','No'] },
      { code: 'M1.6', label: 'Provider SLA/contract copy available on site', type: 'select', options: ['Yes','No','Partial'] },
      { code: 'M1.7', label: 'Comments / observations', type: 'text' },
    ]
  },
  {

      { code: 'M2.1', label: 'Number of folders sampled', type: 'number' },
      { code: 'M2.2', label: 'Folders with valid NHIS card details', type: 'number' },

      { code: 'M2.7', label: 'Comments / observations', type: 'text' },
    ]
  },
  {

  {

    indicators: [

      { code: 'M4.2', label: 'Drug prescriptions match diagnosis in patient folder', type: 'select', options: ['Yes','No','Partial'] },

    indicators: [

      { code: 'M5.5', label: 'Safe water and sanitation facilities available', type: 'select', options: ['Yes','No','Partial'] },

    ]
  },
  {
    id: 'M6', name: 'Financial / FPHC', icon: '💰',
    indicators: [
      { code: 'M6.1', label: 'No co-payments charged to NHIS members for covered services', type: 'select', options: ['Yes','No'] },
      { code: 'M6.2', label: 'FPHC services provided free to eligible beneficiaries', type: 'select', options: ['Yes','No','N/A'] },
      { code: 'M6.3', label: 'Financial records reconcile with claims submitted', type: 'select', options: ['Yes','No','Partial'] },
      { code: 'M6.4', label: 'Provider has received NHIA payment for last period', type: 'select', options: ['Yes','No','Unknown'] },
      { code: 'M6.5', label: 'Revenue from NHIS appropriately recorded', type: 'select', options: ['Yes','No','Partial'] },
      { code: 'M6.6', label: 'Comments / observations', type: 'text' },
    ]
  },
];

// ────────────────────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────────────────────
let sb, currentUser, userRole, userTeamId;
let currentAssignment = null;
let currentVisit = null;
let currentModuleId = null;
let offlineQueue = JSON.parse(localStorage.getItem('nhia_queue') || '[]');
let localAssignments = JSON.parse(localStorage.getItem('nhia_assignments') || '[]');
let localVisits      = JSON.parse(localStorage.getItem('nhia_visits') || '[]');
let localScores      = JSON.parse(localStorage.getItem('nhia_scores') || '{}');

// ────────────────────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  window.addEventListener('online',  () => { hideBanner(); flushQueue(); });
  window.addEventListener('offline', () => showBanner());
  if (!navigator.onLine) showBanner();

  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    await afterLogin(session.user);
  }

  updateQueueBadge();
});

// ────────────────────────────────────────────────────────────────
// AUTH
// ────────────────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    return;
  }
  await afterLogin(data.user);
}

async function afterLogin(user) {
  currentUser = user;

  // Fetch role from user_profiles table
  const { data: profile } = await sb
    .from('user_profiles')
    .select('role, team_id, display_name')
    .eq('id', user.id)
    .single();

  userRole   = profile?.role || 'member';
  userTeamId = profile?.team_id;
  const name = profile?.display_name || user.email;

  document.getElementById('user-info').innerHTML =
    `<strong>${name}</strong><br>${capitalize(userRole)}`;
  document.getElementById('settings-user-info').innerHTML =
    `<strong>${name}</strong><br>${user.email}<br>Role: ${capitalize(userRole)}`;

  // Show Team Leader "New Assignment" button
  if (userRole === 'leader') {
    document.getElementById('btn-new-assignment').style.display = 'inline-flex';
    document.getElementById('nav-report').style.display = 'flex';
  }

  hide('login-screen');
  show('topbar');
  show('bottom-nav');
  document.getElementById('bottom-nav').classList.add('visible');
  navigate('home');

  await loadAssignments();
  subscribeRealtime();
}

async function doLogout() {
  await sb.auth.signOut();
  location.reload();
}

// ────────────────────────────────────────────────────────────────
// REALTIME
// ────────────────────────────────────────────────────────────────
function subscribeRealtime() {
  sb.channel('nhia-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'assignments' }, loadAssignments)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'visits' }, () => {
      if (currentAssignment) loadVisits(currentAssignment.id);
    })
    .subscribe();
}

// ────────────────────────────────────────────────────────────────
// NAVIGATION
// ────────────────────────────────────────────────────────────────
function navigate(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(screen + '-screen').classList.add('active');
  const navBtn = document.querySelector(`[onclick="navigate('${screen}')"]`);
  if (navBtn) navBtn.classList.add('active');

  if (screen === 'home')     loadAssignments();
  if (screen === 'report')   buildReport();
  if (screen === 'settings') updateQueueDisplay();
}

function goToAssignment(id) {
  currentAssignment = localAssignments.find(a => a.id === id);
  renderAssignmentDetail();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('assignment-screen').classList.add('active');
}

function goToModules(visitId) {
  currentVisit = localVisits.find(v => v.id === visitId);
  renderModuleGrid();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('modules-screen').classList.add('active');
}

function goToModule(moduleId) {
  currentModuleId = moduleId;
  renderModuleForm();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('module-form-screen').classList.add('active');
}

// ────────────────────────────────────────────────────────────────
// ASSIGNMENTS
// ────────────────────────────────────────────────────────────────
async function loadAssignments() {
  let query = sb.from('assignments').select('*').order('created_at', { ascending: false });
  if (userRole === 'leader') query = query.eq('team_id', userTeamId);

  const { data, error } = await query;
  if (!error && data) {
    localAssignments = data;
    localStorage.setItem('nhia_assignments', JSON.stringify(data));
  }
  renderAssignmentList();
}

function renderAssignmentList() {
  const el = document.getElementById('assignments-list');
  if (!localAssignments.length) {
    el.innerHTML = '<div class="empty-state"><div class="big">📋</div><p>No assignments yet.</p></div>';
    return;
  }
  el.innerHTML = localAssignments.map(a => `
    <div class="assignment-card" onclick="goToAssignment('${a.id}')">
      <div class="ac-head">
        <div>
          <div class="ac-title">${a.period}</div>
          <div class="ac-period">${a.district}</div>
        </div>
        <span class="status-pill status-${a.status}">${capitalize(a.status)}</span>
      </div>
      <div class="text-muted mt-8" style="font-size:.78rem">
        ${a.members || ''} &nbsp;·&nbsp; ${countVisits(a.id)} visit(s)
      </div>
    </div>
  `).join('');
}

function countVisits(assignmentId) {
  return localVisits.filter(v => v.assignment_id === assignmentId).length;
}

function openNewAssignment() { openModal('modal-assignment'); }

async function createAssignment() {
  const period   = document.getElementById('f-period').value.trim();
  const district = document.getElementById('f-district').value.trim();
  const members  = document.getElementById('f-members').value.trim();
  if (!period || !district) return toast('Period and district are required');

  const rec = {
    period, district, members,
    status: 'active',
    team_id: userTeamId,
    created_by: currentUser.id,
  };

  const { data, error } = await sb.from('assignments').insert(rec).select().single();
  if (error) {
    queueWrite('assignments', rec);
    toast('Saved offline — will sync later');
  } else {
    toast('Assignment created');
  }
  closeModal('modal-assignment');
  await loadAssignments();
}

// ────────────────────────────────────────────────────────────────
// VISITS
// ────────────────────────────────────────────────────────────────
async function loadVisits(assignmentId) {
  const { data, error } = await sb
    .from('visits')
    .select('*')
    .eq('assignment_id', assignmentId)
    .order('visit_date');

  if (!error && data) {
    // Merge — keep visits for other assignments
    localVisits = [
      ...localVisits.filter(v => v.assignment_id !== assignmentId),
      ...data
    ];
    localStorage.setItem('nhia_visits', JSON.stringify(localVisits));
  }
}

function renderAssignmentDetail() {
  const a = currentAssignment;
  document.getElementById('assignment-header').innerHTML = `
    <div class="flex-between">
      <div>
        <h2 style="margin:0;border:none;padding:0">${a.period}</h2>
        <div class="text-muted mt-8">${a.district}</div>
        <div class="text-muted">Team: ${a.members || '—'}</div>
      </div>
      <span class="status-pill status-${a.status}">${capitalize(a.status)}</span>
    </div>
  `;

  loadVisits(a.id).then(() => {
    const visits = localVisits.filter(v => v.assignment_id === a.id);
    const el = document.getElementById('visits-list');
    if (!visits.length) {
      el.innerHTML = '<div class="empty-state"><div class="big">🏥</div><p>No visits added yet.</p></div>';
    } else {
      el.innerHTML = visits.map(v => `
        <div class="visit-row">
          <div>
            <div class="visit-name">${v.facility_name}</div>
            <div class="visit-type">${capitalize(v.visit_type)} · ${v.visit_date || ''}</div>
          </div>
          <div class="visit-actions">
            <button class="btn btn-primary btn-sm" onclick="goToModules('${v.id}')">Assess</button>
            ${v.status !== 'closed' ? `<button class="btn btn-red btn-sm" onclick="closeVisit('${v.id}')">Close</button>` : '<span class="status-pill status-closed">Closed</span>'}
          </div>
        </div>
      `).join('');
    }
  });

  // Actions for Team Leader
  const actEl = document.getElementById('assignment-actions');
  if (userRole === 'leader' && a.status === 'active') {
    actEl.innerHTML = `<button class="btn btn-green btn-block" onclick="generateReport('${a.id}')">Generate Team Report</button>`;
  } else {
    actEl.innerHTML = '';
  }

  document.getElementById('btn-add-visit').style.display = userRole === 'leader' ? 'inline-flex' : 'none';
}

function openAddVisit() { openModal('modal-visit'); }

async function addVisit() {
  const facility  = document.getElementById('f-facility').value.trim();
  const visitType = document.getElementById('f-visit-type').value;
  const visitDate = document.getElementById('f-visit-date').value;
  const notes     = document.getElementById('f-visit-notes').value.trim();
  if (!facility) return toast('Facility name is required');

  const rec = {
    assignment_id: currentAssignment.id,
    facility_name: facility,
    visit_type: visitType,
    visit_date: visitDate,
    notes,
    status: 'open',
    created_by: currentUser.id,
  };

  const { data, error } = await sb.from('visits').insert(rec).select().single();
  if (error) {
    rec.id = 'local_' + Date.now();
    localVisits.push(rec);
    localStorage.setItem('nhia_visits', JSON.stringify(localVisits));
    queueWrite('visits', rec);
    toast('Saved offline');
  } else {
    localVisits.push(data);
    localStorage.setItem('nhia_visits', JSON.stringify(localVisits));
    toast('Visit added');
  }
  closeModal('modal-visit');
  renderAssignmentDetail();
}

async function closeVisit(visitId) {
  if (!confirm('Close this visit? No further assessments can be added.')) return;
  const { error } = await sb.from('visits').update({ status: 'closed' }).eq('id', visitId);
  if (error) {
    queueWrite('visits_update', { id: visitId, status: 'closed' });
    toast('Saved offline');
  }
  const v = localVisits.find(x => x.id === visitId);
  if (v) v.status = 'closed';
  localStorage.setItem('nhia_visits', JSON.stringify(localVisits));
  renderAssignmentDetail();
  toast('Visit closed');
}

// ────────────────────────────────────────────────────────────────
// MODULES
// ────────────────────────────────────────────────────────────────
function renderModuleGrid() {
  const v = currentVisit;
  document.getElementById('visit-context-card').innerHTML = `
    <h2 style="margin:0;border:none;padding:0">${v.facility_name}</h2>
    <div class="text-muted mt-8">${capitalize(v.visit_type)} · ${v.visit_date || ''}</div>
    <div class="text-muted">Select a module to assess</div>
  `;

  const scores = localScores[v.id] || {};
  document.getElementById('module-grid').innerHTML = MODULES.map(m => {
    const done = scores[m.id];
    const pct  = done ? moduleScore(m.id, v.id) : 0;
    return `
      <div class="module-tile" onclick="goToModule('${m.id}')">
        <div class="m-icon">${m.icon}</div>
        <div class="m-name">${m.name}</div>
        <div class="m-prog">${done ? pct + '% scored' : 'Not started'}</div>
        <svg class="progress-ring" width="36" height="36" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="15" fill="none" stroke="#d0d8ee" stroke-width="3"/>
          <circle cx="18" cy="18" r="15" fill="none" stroke="${pct>74?'#27ae60':pct>49?'#e67e22':'#c0392b'}"
            stroke-width="3" stroke-dasharray="${pct*0.942} 94.2" stroke-dashoffset="23.55" stroke-linecap="round"/>
        </svg>
      </div>
    `;
  }).join('');
}

function renderModuleForm() {
  const mod = MODULES.find(m => m.id === currentModuleId);
  const saved = (localScores[currentVisit.id] || {})[currentModuleId] || {};

  document.getElementById('module-form-header').innerHTML = `
    <h2 style="margin:0;border:none;padding:0">${mod.icon} ${mod.name}</h2>
    <div class="text-muted mt-8">${currentVisit.facility_name}</div>
  `;

  document.getElementById('module-indicators').innerHTML = mod.indicators.map(ind => `
    <div class="card indicator-row">
      <div class="ind-code">${ind.code}</div>
      <div class="ind-label">${ind.label}</div>
      ${ind.type === 'select' ? `
        <select id="ind_${ind.code}" style="margin-top:6px">
          ${ind.options.map(o => `<option value="${o}" ${saved[ind.code]===o?'selected':''}>${o}</option>`).join('')}
        </select>
      ` : ind.type === 'number' ? `
        <input type="number" id="ind_${ind.code}" min="0" value="${saved[ind.code]||''}" placeholder="0" style="margin-top:6px"/>
      ` : `
        <textarea id="ind_${ind.code}" placeholder="Enter observations…" style="margin-top:6px">${saved[ind.code]||''}</textarea>
      `}
    </div>
  `).join('');
}

function saveModule() {
  const mod = MODULES.find(m => m.id === currentModuleId);
  const entry = {};
  mod.indicators.forEach(ind => {
    const el = document.getElementById('ind_' + ind.code);
    if (el) entry[ind.code] = el.value;
  });

  if (!localScores[currentVisit.id]) localScores[currentVisit.id] = {};
  localScores[currentVisit.id][currentModuleId] = entry;
  localStorage.setItem('nhia_scores', JSON.stringify(localScores));

  // Persist to Supabase
  const rec = {
    visit_id: currentVisit.id,
    module_id: currentModuleId,
    data: entry,
    scored_by: currentUser.id,
  };
  sb.from('module_scores').upsert(rec, { onConflict: 'visit_id,module_id' })
    .then(({ error }) => { if (error) queueWrite('module_scores', rec); });

  toast('Module saved ✓');
  goToModules(currentVisit.id);
}

function moduleScore(moduleId, visitId) {
  const mod = MODULES.find(m => m.id === moduleId);
  const saved = (localScores[visitId] || {})[moduleId] || {};
  const scorable = mod.indicators.filter(i => i.type === 'select');
  if (!scorable.length) return 0;
  const positive = scorable.filter(i => ['Yes','None found'].includes(saved[i.code])).length;
  return Math.round((positive / scorable.length) * 100);
}

// ────────────────────────────────────────────────────────────────
// REPORT
// ────────────────────────────────────────────────────────────────
function generateReport(assignmentId) {
  currentAssignment = localAssignments.find(a => a.id === assignmentId);
  navigate('report');
}

function buildReport() {
  if (!currentAssignment) {
    document.getElementById('report-body').innerHTML =
      '<div class="empty-state"><p>No assignment selected. Open an assignment and click Generate Report.</p></div>';
    return;
  }
  const a       = currentAssignment;
  const visits  = localVisits.filter(v => v.assignment_id === a.id);
  const date    = new Date().toLocaleDateString('en-GH', { day:'numeric', month:'long', year:'numeric' });

  let html = `
    <div class="report-section">
      <h4>Assignment Details</h4>
      <div class="report-row"><span>Period</span><span>${a.period}</span></div>
      <div class="report-row"><span>District</span><span>${a.district}</span></div>
      <div class="report-row"><span>Team</span><span>${a.members||'—'}</span></div>
      <div class="report-row"><span>Report Date</span><span>${date}</span></div>
      <div class="report-row"><span>Facilities Visited</span><span>${visits.length}</span></div>
    </div>
  `;

  visits.forEach(v => {
    const scores = localScores[v.id] || {};
    html += `<div class="report-section"><h4>${v.facility_name} — ${capitalize(v.visit_type)}</h4>`;
    MODULES.forEach(m => {
      const pct = scores[m.id] ? moduleScore(m.id, v.id) : null;
      html += `
        <div class="report-row">
          <span>${m.icon} ${m.name}</span>
          <span>${pct !== null ? pct + '%' : 'Not assessed'}</span>
        </div>
      `;
      if (pct !== null) {
        html += `<div class="score-bar-wrap"><div class="score-bar ${pct>74?'score-high':pct>49?'score-medium':'score-low'}" style="width:${pct}%"></div></div>`;
      }
    });
    html += '</div>';
  });

  document.getElementById('report-body').innerHTML = html;
}

function downloadReport() {
  if (!currentAssignment) return toast('No report to download');
  const a      = currentAssignment;
  const visits = localVisits.filter(v => v.assignment_id === a.id);
  const date   = new Date().toLocaleDateString('en-GH', { day:'numeric', month:'long', year:'numeric' });

  let body = `
    <html><head><meta charset="UTF-8"/>
    <style>
      body{font-family:'Segoe UI',sans-serif;padding:32px;color:#1a2340}
      h1{color:#1a3a6b;border-bottom:3px solid #f0c040;padding-bottom:8px}
      h2{color:#1a3a6b;margin-top:24px;font-size:1rem}
      table{width:100%;border-collapse:collapse;margin-top:8px}
      td,th{border:1px solid #d0d8ee;padding:8px 10px;font-size:.85rem}
      th{background:#1a3a6b;color:#fff;text-align:left}
      .bar{height:10px;border-radius:4px}
      .high{background:#27ae60}.medium{background:#e67e22}.low{background:#c0392b}
      footer{margin-top:32px;font-size:.78rem;color:#6b7a99;border-top:1px solid #d0d8ee;padding-top:12px}
    </style></head><body>
    <h1>NHIA Provider M&amp;E — Consolidated Team Report</h1>
    <p><strong>Period:</strong> ${a.period} &nbsp;|&nbsp; <strong>District:</strong> ${a.district}</p>
    <p><strong>Team:</strong> ${a.members||'—'} &nbsp;|&nbsp; <strong>Date:</strong> ${date}</p>
    <p><strong>Facilities Visited:</strong> ${visits.length}</p>
  `;

  visits.forEach(v => {
    const scores = localScores[v.id] || {};
    body += `<h2>${v.facility_name} (${capitalize(v.visit_type)})</h2>
    <table><tr><th>Module</th><th>Score</th><th>Visual</th></tr>`;
    MODULES.forEach(m => {
      const pct = scores[m.id] ? moduleScore(m.id, v.id) : null;
      const cls = pct > 74 ? 'high' : pct > 49 ? 'medium' : 'low';
      body += `<tr>
        <td>${m.icon} ${m.name}</td>
        <td>${pct !== null ? pct + '%' : 'Not assessed'}</td>
        <td>${pct !== null ? `<div class="bar ${cls}" style="width:${pct}%"></div>` : '—'}</td>
      </tr>`;
    });
    body += '</table>';
  });

  body += `<footer>Generated by NHIA M&amp;E Tools · ${date} · Ghana National Health Insurance Authority</footer></body></html>`;

  const blob = new Blob([body], { type: 'text/html' });
  const url  = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `NHIA_Report_${a.period.replace(/\s+/g,'_')}_${date.replace(/\s+/g,'_')}.html`;
  link.click();
  URL.revokeObjectURL(url);
  toast('Report downloaded');
}

// ────────────────────────────────────────────────────────────────
// OFFLINE QUEUE
// ────────────────────────────────────────────────────────────────
function queueWrite(table, data) {
  offlineQueue.push({ table, data, ts: Date.now() });
  localStorage.setItem('nhia_queue', JSON.stringify(offlineQueue));
  updateQueueBadge();
}

async function flushQueue() {
  if (!offlineQueue.length || !navigator.onLine) return;
  const pending = [...offlineQueue];
  offlineQueue = [];
  localStorage.setItem('nhia_queue', JSON.stringify(offlineQueue));

  for (const item of pending) {
    if (item.table === 'visits_update') {
      await sb.from('visits').update({ status: item.data.status }).eq('id', item.data.id);
    } else {
      await sb.from(item.table).upsert(item.data);
    }
  }
  toast(`Synced ${pending.length} pending item(s)`);
  updateQueueBadge();
  updateQueueDisplay();
}

function updateQueueBadge() {
  const badge = document.getElementById('sync-badge');
  if (offlineQueue.length) {
    badge.textContent = `⏳ ${offlineQueue.length} pending`;
    badge.classList.add('visible');
  } else {
    badge.classList.remove('visible');
  }
}

function updateQueueDisplay() {
  document.getElementById('queue-info').textContent =
    offlineQueue.length ? `${offlineQueue.length} item(s) pending sync` : 'All data synced ✓';
}

// ────────────────────────────────────────────────────────────────
// UTILS
// ────────────────────────────────────────────────────────────────
function show(id) { const el = document.getElementById(id); if (el) el.style.display = ''; }
function hide(id) { const el = document.getElementById(id); if (el) el.style.display = 'none'; }
function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function showBanner()   { document.getElementById('offline-banner').classList.add('visible'); }
function hideBanner()   { document.getElementById('offline-banner').classList.remove('visible'); }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
</script>
